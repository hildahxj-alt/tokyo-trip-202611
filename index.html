let T=JSON.parse(localStorage.getItem(KEY)||'null')||base,day=0,pending=null;const $=s=>document.querySelector(s),escape=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(T));const icons=()=>window.lucide&&lucide.createIcons({attrs:{'stroke-width':1.8}});const dir=p=>{let q=new URLSearchParams({api:1,origin:p[0],destination:p.at(-1),travelmode:'transit'});if(p.length>2)q.set('waypoints',p.slice(1,-1).join('|'));return'https://www.google.com/maps/dir/?'+q};const search=x=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x);const head=(en,title,sub,add='')=>`<div class="top"><div><p class="en">${en}</p><h1 class="title">${title}</h1><p class="sub">${sub}</p></div>${add}</div>`;const badge=x=>`<span class="badge ${x==='预约'||x==='门票'?'booking':x==='提醒'?'remind':''}">${x}</span>`;
function home(){let done=Object.values(T.done).filter(Boolean).length,mode=T.rate.mode||'cny';$('#home').innerHTML=`${head(T.trip.en,T.trip.name,`${T.trip.dates} · ${T.trip.days} DAYS`)}<article class="focus"><p class="en">NEXT UP</p><h2>${T.days[day].date} · ${T.days[day].theme}</h2><p>${T.days[day].reminder}</p></article><section class="section"><div class="section-head"><h2>FLIGHT ITINERARY</h2><button class="link" data-a="flights">查看机票</button></div><div class="rail">${T.flights.map(f=>`<article class="flight pending"><div class="flight-top"><span>${f.day}</span><span>${f.code} · ${f.status}</span></div><div class="flight-route"><div><strong>${f.fc}</strong><span>${f.from}</span></div><i data-lucide="plane"></i><div class="right"><strong>${f.tc}</strong><span>${f.to}</span></div></div><div class="flight-bottom"><span>${f.date}</span><span>${f.time}</span></div></article>`).join('')}</div></section><section class="section"><div class="section-head"><h2>ROUTE MAP</h2><a class="link" target="_blank" href="${dir([RY,'Hakone-Yumoto Station','Narita International Airport'])}">Google 地图 ↗</a></div><div class="card"><div class="route">${[...T.trip.cities,'成田'].map((x,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b>${x}</div>`).join('')}</div></div></section><section class="section"><div class="section-head"><h2>THE WHOLE JOURNEY</h2></div><div class="stats"><div class="stat"><b>${T.days.length}</b><span>天完整日程</span></div><div class="stat"><b>${T.tickets.length}</b><span>份票据凭证</span></div><div class="stat"><b>${T.hotels.length}</b><span>段住宿</span></div><div class="stat"><b>${done} / ${T.checklist.length}</b><span>出发清单</span></div></div></section><section class="section"><div class="section-head"><h2>LIVE EXCHANGE RATE</h2><button class="link" data-a="rate">刷新</button></div><div class="card" style="padding:14px"><div class="currency-switch"><button class="${mode==='cny'?'active':''}" data-a="currency" data-mode="cny">人民币 → 日元</button><button class="${mode==='jpy'?'active':''}" data-a="currency" data-mode="jpy">日元 → 人民币</button></div><div class="rate"><input id="amount" inputmode="decimal" value="${mode==='cny'?'100':'1000'}" aria-label="换算金额"><div class="result" id="exchange-result"></div></div><div class="quick">${(mode==='cny'?[100,500,1000,5000]:[1000,3000,5000,10000]).map(x=>`<button data-amount="${x}">${mode==='cny'?'¥':'￥'}${x}</button>`).join('')}</div><p class="meta" id="rate-meta"></p></div></section>`;rateUI();icons()}
function schedule(){let d=T.days[day];$('#schedule').innerHTML=`${head('ITINERARY',`${T.days.length}天完整日程`,'选择日期，查看当天必须完成的事。')}<div class="dates">${T.days.map((x,i)=>`<button class="date ${i===day?'active':''}" data-day="${i}"><b>${x.date.slice(3)}</b><span>${x.week}</span></button>`).join('')}</div><article class="summary"><p class="en">2026.${d.date} · ${d.city}</p><h2>${d.theme}</h2><p class="sub">住宿：${d.stay}</p><div class="notice">今日提醒：${d.reminder}</div></article><section class="section"><div class="section-head"><h2>DAILY WEATHER</h2><button class="link" data-a="weather">刷新</button></div><div class="card weather" id="weather"><i data-lucide="cloud-sun"></i><div><b>接近出发时刷新</b><span>${d.city} 的预报将在进入 16 天窗口后可用</span></div></div></section><section class="section"><div class="section-head"><h2>ROUTE MAP</h2></div><div class="map"><iframe title="${d.date} 当天路线" loading="lazy" src="${dir(d.points)}"></iframe><a target="_blank" href="${dir(d.points)}">在 Google 地图查看今日路线 <i data-lucide="arrow-up-right"></i></a></div></section><section class="section"><div class="section-head"><h2>DAILY SCHEDULE</h2><button class="link" data-a="add-act">新增行程</button></div><ol class="timeline">${d.acts.map((a,i)=>`<li><time>${a[0]}</time><i class="dot"></i><article class="activity"><div class="activity-top"><h3>${escape(a[2])}</h3>${badge(a[1])}</div><p>${escape(a[3])}</p><div class="actions"><a target="_blank" href="${search(a[2])}">地图导航</a><button data-a="edit-act" data-i="${i}">编辑</button><button class="danger" data-a="del-act" data-i="${i}">删除</button></div></article></li>`).join('')}</ol></section><section class="section"><div class="section-head"><h2>旅行攻略</h2><button class="link" data-a="guide">添加链接</button></div><div class="card list">${d.guides.length?d.guides.map(g=>`<article class="row"><div class="row-icon"><i data-lucide="bookmark"></i></div><div class="row-main"><h3><a target="_blank" href="${escape(g.url)}">${escape(g.title)} ↗</a></h3><p>${escape(g.source)} · ${escape(g.note)}</p></div></article>`).join(''):'<p class="empty">把小红书、Google Maps 或网页链接收藏到当天。</p>'}</div></section>`;icons();weather(d.city)}
function tickets(){let rows=T.tickets;$('#tickets').innerHTML=`${head('TICKET WALLET','票夹','集中管理旅行中的凭证。','<button class="add" data-a="add-ticket"><i data-lucide="plus"></i></button>')}<section class="section"><div class="card list">${rows.length?rows.map((t,i)=>`<button class="row" data-a="ticket" data-i="${i}" style="width:100%;border-top:0;border-right:0;border-left:0;background:transparent;text-align:left"><div class="row-icon"><i data-lucide="ticket"></i></div><div class="row-main"><h3>${escape(t.name)}</h3><p>${escape(t.kind)} · ${t.date} ${t.time} · ${escape(t.place)}</p></div><i data-lucide="chevron-right"></i></button>`).join(''):'<p class="empty">还没有票据。可以上传图片、PDF 或先记下预约。</p>'}</div></section>`;icons()}
function stays(){let rows=T.hotels;$('#stays').innerHTML=`${head('ACCOMMODATION','住宿','按日期集中查看。','<button class="add" data-a="add-hotel"><i data-lucide="plus"></i></button>')}<section class="section"><div class="card list">${rows.map((h,i)=>`<article class="row"><div class="row-icon"><i data-lucide="bed-double"></i></div><div class="row-main"><h3>${escape(h.name)}</h3><p>${h.in} — ${h.out} · ${h.n}晚 · ${escape(h.area)}</p><p>${escape(h.address)}</p></div><button class="link" data-a="hotel" data-i="${i}">编辑</button></article>`).join('')}</div></section>`;icons()}
function checks(){let n=Object.values(T.done).filter(Boolean).length;$('#checklist').innerHTML=`${head('BEFORE DEPARTURE','出发清单',`${n} / ${T.checklist.length} 已完成`)}<div class="progress"><i style="width:${n/T.checklist.length*100}%"></i></div><section class="section"><div class="card list">${T.checklist.map((x,i)=>`<label class="row"><input class="check" data-check="${i}" type="checkbox" ${T.done[i]?'checked':''}><div class="row-main"><h3>${escape(x)}</h3>${x==='填写 Visit Japan Web 日本入境手续（二维码）'?'<p><a target="_blank" href="https://services.digital.go.jp/en/visit-japan-web/">打开 Visit Japan Web ↗</a></p>':''}</div></label>`).join('')}</div></section>`}
function all(){home();schedule();tickets();stays();checks()}
function rateUI(){let amount=Number($('#amount')?.value||0),r=T.rate.v,mode=T.rate.mode||'cny',out=mode==='cny'?'≈ ¥'+(amount/r).toLocaleString('ja-JP',{maximumFractionDigits:0})+' JPY':'≈ ¥'+(amount*r).toFixed(2)+' CNY';$('#exchange-result').textContent=out;$('#rate-meta').textContent='¥1 CNY ≈ ¥'+(1/r).toFixed(2)+' JPY · '+T.rate.at}async function refreshRate(){let m=$('#rate-meta');m.textContent='正在更新汇率…';try{let d=await fetch('https://open.er-api.com/v6/latest/CNY').then(x=>x.json());if(!d.rates?.JPY)throw 0;T.rate={...T.rate,v:1/d.rates.JPY,at:'更新于 '+new Date().toLocaleString('zh-CN')};save()}catch{T.rate.at='网络不可用，保留最近一次缓存';save()}rateUI()}
async function weather(city){let panel=$('#weather');if(!panel||((new Date('2026-11-04')-new Date())/864e5>16))return;let co={东京:'35.6762,139.6503',箱根:'35.2324,139.1069'}[city]||'35.6762,139.6503';try{let[a,b]=co.split(','),d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${a}&longitude=${b}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo`).then(x=>x.json()),i=d.daily.time.indexOf('2026-'+T.days[day].date);if(i<0)throw 0;panel.innerHTML=`<i data-lucide="cloud-sun"></i><div><b>${d.daily.temperature_2m_max[i]}° / ${d.daily.temperature_2m_min[i]}°</b><span>降雨概率 ${d.daily.precipitation_probability_max[i]||0}% · ${city}</span></div><small>实时预报</small>`;icons()}catch{}}
function dialog(title,body,submit){let el=$('#dialog');el.innerHTML=`<form method="dialog"><div class="modal-head"><h2>${title}</h2><button class="add" value="cancel"><i data-lucide="x"></i></button></div><div class="modal-body">${body}<div class="modal-actions"><button class="btn ghost" value="cancel">取消</button><button class="btn" value="default">保存</button></div></div></form>`;el.querySelector('form').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();submit(new FormData(e.currentTarget));el.close()});el.showModal();icons()}
function activity(i=null){let a=i===null?['','景点','','']:T.days[day].acts[i];dialog(i===null?'新增行程':'编辑行程',`<div class="form"><label>时间<input required name="time" value="${escape(a[0])}"></label><label>分类<select name="type">${['景点','交通','住宿','餐饮','购物','预约','门票','提醒'].map(x=>`<option ${a[1]===x?'selected':''}>${x}</option>`).join('')}</select></label><label>标题<input required name="title" value="${escape(a[2])}"></label><label>备注<textarea name="note">${escape(a[3])}</textarea></label></div>`,f=>{let x=[f.get('time'),f.get('type'),f.get('title'),f.get('note')];if(i===null)T.days[day].acts.push(x);else T.days[day].acts[i]=x;save();schedule()})}
function ticket(i=null){let x=i===null?{kind:'活动预约',name:'',date:'',time:'',place:'',order:'',note:'',file:'',fileType:''}:T.tickets[i];dialog(i===null?'新增票据':'票据详情',`<div class="form"><label>分类<select name="kind">${['机票','火车票','景点门票','餐厅预约','酒店预约','活动预约'].map(v=>`<option ${x.kind===v?'selected':''}>${v}</option>`).join('')}</select></label><label>票据名称<input required name="name" value="${escape(x.name)}"></label><label>日期<input name="date" value="${x.date}"></label><label>时间<input name="time" value="${x.time}"></label><label>地点<input name="place" value="${escape(x.place)}"></label><label>订单号<input name="order" value="${escape(x.order)}"></label><label>备注<textarea name="note">${escape(x.note)}</textarea></label>${x.file?(x.fileType==='application/pdf'?`<a class="link" target="_blank" href="${x.file}">打开已上传 PDF ↗</a>`:`<img class="preview" src="${x.file}">`):''}<button type="button" class="btn ghost" data-a="upload" data-i="${i===null?'new':i}">上传 PNG / JPG / PDF</button></div>`,f=>{let n={...x,...Object.fromEntries(f.entries())};if(i===null)T.tickets.push(n);else T.tickets[i]=n;save();tickets()})}
function hotel(i=null){let x=i===null?{name:'',area:'',in:'',out:'',n:'',address:'',platform:'待确认',note:''}:T.hotels[i];dialog(i===null?'新增住宿':'编辑住宿',`<div class="form"><label>酒店名称<input required name="name" value="${escape(x.name)}"></label><label>区域<input name="area" value="${escape(x.area)}"></label><label>入住日期<input name="in" value="${x.in}"></label><label>退房日期<input name="out" value="${x.out}"></label><label>入住晚数<input name="n" value="${x.n}"></label><label>地址<input name="address" value="${escape(x.address)}"></label><label>预订状态<input name="platform" value="${escape(x.platform)}"></label><label>备注<textarea name="note">${escape(x.note)}</textarea></label></div>`,f=>{let n={...x,...Object.fromEntries(f.entries())};if(i===null)T.hotels.push(n);else T.hotels[i]=n;save();stays()})}
function guide(){dialog('添加旅行攻略',`<div class="form"><label>标题<input required name="title"></label><label>来源<input name="source" placeholder="小红书 / 网页 / Google Maps"></label><label>链接<input required type="url" name="url"></label><label>备注<textarea name="note"></textarea></label></div>`,f=>{T.days[day].guides.push(Object.fromEntries(f.entries()));save();schedule()})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.amount){$('#amount').value=b.dataset.amount;rateUI();return}if(b.dataset.day!==undefined){day=+b.dataset.day;home();schedule();return}let a=b.dataset.a,i=+(b.dataset.i||0);if(a==='currency'){T.rate.mode=b.dataset.mode;save();home();return}if(a==='rate')refreshRate();if(a==='weather')weather(T.days[day].city);if(a==='add-act')activity();if(a==='edit-act')activity(i);if(a==='del-act'){T.days[day].acts.splice(i,1);save();schedule()}if(a==='guide')guide();if(a==='add-ticket')ticket();if(a==='ticket')ticket(i);if(a==='add-hotel')hotel();if(a==='hotel')hotel(i);if(a==='flights')dialog('航班信息',`<div class="form">${T.flights.map(f=>`<div class="card" style="padding:13px"><b>${f.day} · ${f.fc} → ${f.tc}</b><p class="sub">${f.detail}</p></div>`).join('')}</div>`,()=>{});if(a==='upload'){pending=b.dataset.i;$('#upload').click()}});document.addEventListener('input',e=>{if(e.target.id==='amount')rateUI()});document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){T.done[e.target.dataset.check]=e.target.checked;save();home();checks()}});$('#upload').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let n={kind:'票据',name:f.name,date:'',time:'',place:'',order:'',note:'',file:r.result,fileType:f.type};if(pending==='new')T.tickets.push(n);else Object.assign(T.tickets[+pending],{file:r.result,fileType:f.type});save();$('#dialog').close();tickets()};r.readAsDataURL(f)});if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');all();
